<!doctype html><html lang="sq"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fikhu Hanefi | Drita Hanefi</title><link rel="stylesheet" href="../../assets/app.css"><style>.tools{display:grid;grid-template-columns:2fr 1fr;gap:10px;margin:16px 0}.tools input,.tools select{padding:14px;border-radius:13px;border:1px solid #397565;background:#061b17;color:#fff}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}.item{padding:18px;border:1px solid #285b4d;border-radius:18px;background:#0b2c25}.item h3{margin:5px 0 10px}.badge{display:inline-block;padding:5px 8px;border-radius:999px;background:#d7b35d22;color:#f1d98e;font-size:12px;margin:2px}.preview{color:#c8ddd7;line-height:1.6}.open{border:0;border-radius:11px;padding:10px 13px;background:#d7b35d;font-weight:800}.modal{display:none;position:fixed;inset:0;background:#00100ddd;z-index:50;overflow:auto;padding:16px}.modal.on{display:block}.sheet{max-width:900px;margin:auto;background:#f8fbf9;color:#17352c;border-radius:20px;padding:20px}.field{padding:13px 0;border-bottom:1px solid #dce7e2}.label{font-size:12px;font-weight:900;color:#56736a}.value{white-space:pre-wrap;line-height:1.75}.arabic{direction:rtl;text-align:right;font-size:24px}.close{float:right;font-size:24px}@media(max-width:650px){.tools{grid-template-columns:1fr}}</style></head><body>
<header><a href="../../index.html">☾ Drita Hanefi</a><span>Fikhu Hanefi</span></header><main><section class="hero"><h1>Fikhu Hanefi</h1><p>Enciklopedia juridike Hanefi me dispozitë, tekst arab, përkthim dhe burim.</p><div id="count">Duke u lidhur me bazën LIVE…</div></section><div class="tools"><input id="q" placeholder="Kërko: abdes, namaz, agjërim…"><select id="cat"><option value="">Të gjitha kategoritë</option></select></div><div id="state" class="panel">Po ngarkohen të dhënat reale…</div><section id="cards" class="cards"></section></main><div id="modal" class="modal"><div class="sheet"><button class="close" onclick="closeM()">×</button><h2 id="mt"></h2><div id="trail" style="font-size:12px;color:#56736a;margin:4px 0 12px"></div><div id="mb"></div></div></div>
<script>
const API="https://script.google.com/macros/s/AKfycbxJwhkJzGIXDRDJkHv4Oc1bLueZdccq0rZirfrnAWJFqaeOerV3qDG9O0A3cs5_WIBJ/exec",TYPE="fikh",FIELDS=["ID","Kategoria","Tema","Nën-tema","Pyetja","Përgjigja","Dispozita / Përmbledhja","Teksti Arab","Përkthimi i Plotë","Medhhebi","Autori","Burimi","Referenca","URL Burimi"],CATS=["Kategoria","Lloji Materialit"],TITLES=["Tema","Pyetja"],PREVIEWS=["Dispozita / Përmbledhja","Përkthimi i Plotë","Përgjigja"];let ALL=[],VIEW=[];
const val=(o,ks)=>{for(const k of ks)if(o[k]!=null&&String(o[k]).trim())return String(o[k]).trim();return""}, esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function category(o){return val(o,CATS)||"Të tjera"}function title(o){return val(o,TITLES)||o.ID||"Pa titull"}function preview(o){return val(o,PREVIEWS)}
function draw(){const box=document.getElementById("cards"),st=document.getElementById("state");box.innerHTML="";if(!VIEW.length){st.style.display="block";st.textContent=ALL.length?"Nuk u gjet rezultat.":"Nuk ka regjistrime të publikuara.";return}st.style.display="none";VIEW.forEach((o,i)=>{let d=document.createElement("article");d.className="item";d.innerHTML='<div><span class="badge">'+esc(category(o))+'</span></div><h3>'+esc(title(o))+'</h3><div class="preview">'+esc(preview(o))+'</div><p><button class="open" data-i="'+i+'">Lexo të plotë</button></p>';d.querySelector("button").onclick=()=>openM(o);box.appendChild(d)})}
function openM(o){document.getElementById("mt").textContent=title(o);document.getElementById("trail").textContent=[o.Kategoria,o.Tema,o["Nën-tema"]].filter(Boolean).join(" › ");const b=document.getElementById("mb");b.innerHTML="";FIELDS.forEach(k=>{if(o[k]==null||!String(o[k]).trim())return;const f=document.createElement("div");f.className="field";f.innerHTML='<div class="label">'+esc(k)+'</div><div class="value '+(/arab/i.test(k)?"arabic":"")+'">'+esc(o[k])+'</div>';b.appendChild(f)});document.getElementById("modal").classList.add("on")}
function closeM(){document.getElementById("modal").classList.remove("on")}
function filter(){let q=document.getElementById("q").value.toLowerCase(),c=document.getElementById("cat").value;VIEW=ALL.filter(o=>(!q||Object.values(o).join(" ").toLowerCase().includes(q))&&(!c||category(o)===c));draw()}
async function load(){try{let r=await fetch(API+"?type="+encodeURIComponent(TYPE)+"&_="+Date.now(),{cache:"no-store"}),j=await r.json();if(!j.ok)throw Error(j.error||"API");ALL=Array.isArray(j.data)?j.data:[];VIEW=[...ALL];document.getElementById("count").textContent=ALL.length+" regjistrime të publikuara";let cs=[...new Set(ALL.map(category))].sort();document.getElementById("cat").innerHTML='<option value="">Të gjitha kategoritë</option>'+cs.map(x=>'<option>'+esc(x)+'</option>').join("");draw()}catch(e){document.getElementById("state").textContent="Baza LIVE nuk u ngarkua: "+e.message}}
const qp=new URLSearchParams(location.search).get("q");if(qp)document.getElementById("q").value=qp;document.getElementById("q").oninput=filter;document.getElementById("cat").onchange=filter;load().then?.(()=>filter());
</script></body></html>
