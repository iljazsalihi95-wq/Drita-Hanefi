<!doctype html><html lang="sq"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#052f27"><title>Më bëj një temë – Drita Hanefi</title><link rel="stylesheet" href="../../assets/app.css"><style>.composer{max-width:980px;margin:auto;padding:14px}.box{background:#082f26;border:1px solid #d7b35d55;border-radius:20px;padding:18px;margin:12px 0}.row{display:flex;gap:8px}.row input{flex:1;padding:14px;border-radius:12px;border:1px solid #d7b35d55;background:#031e19;color:#fff}.row button{padding:0 18px;border:0;border-radius:12px;background:#d7b35d;font-weight:900}.sec{margin:14px 0;padding:14px;border-radius:14px;background:#061f1a;border:1px solid #ffffff12}.sec h3{color:#f1d98e}.item{padding:10px 0;border-bottom:1px solid #ffffff10}.muted{color:#b7d5c8}.bad{color:#ff9b9b}@media(max-width:600px){.row{display:grid}.row button{padding:13px}}</style></head><body><div class="composer"><p><a href="../../index.html">⌂ Ballina</a></p><section class="box"><h1>Më bëj një temë</h1><p class="muted">Ndërto material studimi nga burimet ekzistuese të Drita Hanefi. Sistemi nuk shpik citime: shfaq vetëm materialin që kthen baza.</p><div class="row"><input id="q" placeholder="p.sh. Namazi, sabri, familja, zekati…"><button id="go">Ndërto</button></div></section><div id="out" class="box">Shkruaj temën.</div></div><script>
const API="https://script.google.com/macros/s/AKfycbyfIejtkgBhFNL1hEb9Esf2UXFjBw9_GQc3TmC2Gwm4orDVy3dB_rjx_swnpZHQk2dW/exec",$=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function title(x){return x.Titulli||x.Tema||x.Pyetja||x.Sure||x.ID||x.Id||"Material"}function body(x){return x["Përkthimi Shqip"]||x["Përkthimi i Plotë"]||x["Dispozita / Përmbledhja"]||x.Përgjigja||x.Shqip||x.Komenti||x.Shpjegimi||x.Text||""}function ref(x){return x.Referenca||x.Burimi||x.Vepra||""}
async function run(){let q=$("#q").value.trim();if(!q)return;$("#out").innerHTML="Duke kërkuar në Kuran, Hadith, Fikh, Tefsir dhe Akide…";try{let r=await fetch(API+"?action=ligjerate&tema="+encodeURIComponent(q)+"&_="+Date.now(),{cache:"no-store"}),j=await r.json();if(!j.ok)throw Error(j.error||"API");let html="<h2>"+esc(j.tema||q)+"</h2>";for(const [name,rows] of Object.entries(j.sections||{})){html+='<section class="sec"><h3>'+esc(name.toUpperCase())+'</h3>';if(!rows?.length){html+='<p class="muted">Nuk u gjet material në këtë burim.</p>'}else rows.forEach(x=>html+='<article class="item"><b>'+esc(title(x))+'</b><div>'+esc(body(x))+'</div>'+(ref(x)?'<small class="muted">Burimi: '+esc(ref(x))+'</small>':'')+'</article>');html+="</section>"}$("#out").innerHTML=html}catch(e){$("#out").innerHTML='<span class="bad">Nuk u ndërtua tema: '+esc(e.message)+'</span>'}}
$("#go").onclick=run;$("#q").onkeydown=e=>{if(e.key==="Enter")run()};const initial=new URLSearchParams(location.search).get("q");if(initial){$("#q").value=initial;run()}
</script></body></html>
