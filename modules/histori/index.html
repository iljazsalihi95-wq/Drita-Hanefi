<!doctype html><html lang="sq"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Histori Islame • Drita Hanefi</title><style>
*{box-sizing:border-box}html,body{margin:0;background:#06151d;color:#eef7f4;font-family:Arial,sans-serif}
body{min-height:100vh;background:linear-gradient(180deg,#071b26,#041016)}
.top{position:sticky;top:0;z-index:20;background:rgba(5,20,28,.97);border-bottom:1px solid #1f6254;padding:12px}
.topin{max-width:1050px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{font-weight:900;font-size:22px}.sub{font-size:12px;color:#b9d8cf;margin-top:2px}
.wrap{max-width:1050px;margin:auto;padding:16px 16px 90px}
.hero{background:linear-gradient(135deg,#0b3b32,#0b2432);border:1px solid #277763;border-radius:24px;padding:22px;box-shadow:0 14px 36px #0006}
.hero h1{margin:0 0 8px;font-size:30px;color:#ffe28b}.hero p{margin:0;color:#d7ebe5;line-height:1.6}
.tools{display:flex;gap:9px;margin:14px 0;position:sticky;top:70px;z-index:15;background:#06151dee;padding:8px 0}
.search{flex:1;border:1px solid #285d58;border-radius:15px;background:#fff;color:#15231f;padding:13px 15px;font-size:16px;outline:none}
.btn{border:0;border-radius:15px;padding:0 18px;font-weight:900;background:#e7c35f;color:#15231f}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin-top:15px}
.card{display:block;text-decoration:none;color:#fff;background:#0a2730;border:1px solid #285d58;border-radius:19px;padding:16px;box-shadow:0 8px 22px #0003}
.card:active{transform:scale(.985)}.card h3{margin:5px 0 8px;color:#ffe28b}.card p{margin:0;color:#c7ded8;line-height:1.5}
.ico{font-size:32px}.status{padding:14px;border:1px dashed #285d58;border-radius:16px;color:#b9d8cf;text-align:center;margin:14px 0}
.period{margin:20px 0}.period h2{color:#ffe28b;border-bottom:1px solid #285d58;padding-bottom:9px}.timeline{display:grid;gap:11px}.item{background:#0a2730;border:1px solid #285d58;border-radius:18px;box-shadow:0 8px 22px #0003;overflow:hidden}.item summary{list-style:none;cursor:pointer;padding:16px;display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start}.item summary::-webkit-details-marker{display:none}.item[open] summary{background:#0e3435;border-bottom:1px solid #285d58}.date{background:#e7c35f;color:#13211f;border-radius:12px;padding:8px;font-size:11px;font-weight:900;min-width:58px;text-align:center}.item h3{margin:3px 0 6px;color:#ffe28b;font-size:20px}.inside{padding:16px}.inside p{margin:8px 0;line-height:1.72;color:#d7ebe5;white-space:pre-wrap}.label{color:#d8c878;font-size:11px;text-transform:uppercase;font-weight:900;letter-spacing:.05em}.sourcebox{margin-top:13px;padding:12px;border:1px solid #6e683b;border-radius:13px;background:#102e2b}.meta{font-size:12px;color:#8fb8ae;margin-top:7px}.sourceLink{display:inline-block;margin-top:9px;color:#13211f;background:#e7c35f;border-radius:10px;padding:8px 11px;font-weight:900;text-decoration:none}
.back{color:#ffe28b;text-decoration:none;font-weight:800}.chips{display:flex;gap:7px;overflow:auto;padding:12px 0}.chip{white-space:nowrap;padding:9px 12px;border:1px solid #285d58;border-radius:999px;color:#d7ebe5}
footer{text-align:center;color:#6f9d92;padding:28px 10px}
</style></head><body>
<header class="top"><div class="topin"><div><div class="brand">☪️ Drita Hanefi</div><div class="sub">Enciklopedia Hanefi–Maturidije</div></div><a class="back" href="../../index.html">⌂ Ballina</a></div></header><main class="wrap"><section class="hero"><h1>🏛️ Histori Islame</h1><p>Periudhë → ngjarje → tekst historik, me datim, rajon, argument kuranor/hadithor dhe burime të verifikuara.</p></section>
<div class="tools"><input id="q" class="search" placeholder="Kërko në Histori Islame…"><button class="btn" onclick="render(ALL)">Kërko</button></div>
<div id="status" class="status">Duke u lidhur…</div><div id="count" class="meta"></div><section id="list"></section></main>
<footer>Drita Hanefi • Histori Islame</footer><script>
const API="https://script.google.com/macros/s/AKfycbyZWyxCfIvU_tXY_TYZ6R4qUFO_NLS6mCBcpMIB3yh7hmCW-_S332dwb1gnKiaaje6K/exec";
const ACTION="histori";
let ALL=[];
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function val(o,keys){for(const k of keys){if(o&&o[k]!==undefined&&o[k]!==null&&String(o[k]).trim())return o[k]}return ''}
function raw(r,keys){return val(r&&r.raw?r.raw:{},keys)}
function model(r){return{id:val(r,['id'])||raw(r,['ID']),period:val(r,['category'])||raw(r,['Periudha']),hijri:raw(r,['Viti Hixhri']),gregorian:raw(r,['Viti Gregorian']),region:raw(r,['Rajoni']),topic:val(r,['topic'])||raw(r,['Tema']),subtopic:val(r,['subtopic'])||raw(r,['Nëntema']),title:val(r,['title'])||raw(r,['Titulli']),intro:raw(r,['Përmbledhje']),text:val(r,['albanian'])||raw(r,['Teksti i plotë shqip']),quran:raw(r,['Argument kuranor']),hadith:raw(r,['Argument nga Hadithi']),source:raw(r,['Burimi kryesor']),reference:val(r,['reference'])||raw(r,['Referenca']),url:val(r,['url'])||raw(r,['URL Burimi']),editorial:raw(r,['Koment redaksional']),keywords:val(r,['keywords'])||raw(r,['Fjalë kyçe']),status:val(r,['status'])||raw(r,['Statusi']),verified:raw(r,['Status Verifikimi'])}}
function complete(r){const audit=[r.title,r.intro,r.text,r.source,r.reference,r.editorial].join(' ');return r.id&&r.period&&(r.hijri||r.gregorian)&&r.region&&r.topic&&r.title&&r.text&&r.source&&r.reference&&!/PROVIZOR|PËR VERIFIKIM|PËR T.U SHTUAR|DO TË PLOTËSOHET|PËRMBLEDHJE TEMATIKE|JO CITIM/i.test(audit)&&(!r.status||/PUBLIKUAR/i.test(r.status))}
function yearOf(r){const n=String(r.hijri||r.gregorian).match(/\d+/);return n?Number(n[0]):999999}
function render(rows){
 const q=($('#q').value||'').toLocaleLowerCase('sq');
 const a=rows.filter(r=>!q||JSON.stringify(r).toLocaleLowerCase('sq').includes(q));
 $('#count').textContent=a.length+' ngjarje';const groups=a.reduce((o,r)=>((o[r.period]??=[]).push(r),o),{});
 $('#list').innerHTML=a.length?Object.entries(groups).sort(([a],[b])=>a.localeCompare(b,'sq')).map(([name,items])=>`<section class="period"><h2>${esc(name)}</h2><div class="timeline">${items.sort((a,b)=>yearOf(a)-yearOf(b)).map(r=>`<details class="item" ${q?'open':''}><summary><div class="date">${esc(r.hijri||r.gregorian)}</div><div><div class="label">${esc([r.topic,r.subtopic].filter(Boolean).join(' → '))}</div><h3>${esc(r.title)}</h3><div class="meta">${esc([r.gregorian&&r.hijri?('Viti '+r.gregorian):'',r.region].filter(Boolean).join(' • '))}</div></div></summary><div class="inside">${r.intro?`<div class="label">Përmbledhja e ngjarjes</div><p>${esc(r.intro)}</p>`:''}<div class="label">Teksti historik</div><p>${esc(r.text)}</p>${r.quran?`<div class="label">Argument kuranor</div><p>${esc(r.quran)}</p>`:''}${r.hadith?`<div class="label">Argument nga Hadithi</div><p>${esc(r.hadith)}</p>`:''}<div class="sourcebox"><span class="label">Burimi dhe referenca</span><b>${esc(r.source)}</b><div class="meta">${esc(r.reference)}</div>${r.verified?`<div class="meta">Verifikuar: ${esc(r.verified)}</div>`:''}${/^https?:\/\//i.test(r.url)?`<a class="sourceLink" href="${esc(r.url)}" target="_blank" rel="noopener">Hap burimin ↗</a>`:''}</div></div></details>`).join('')}</div></section>`).join(''):'<div class="status">Nuk u gjet ngjarje me këtë kërkim.</div>';
}
async function load(){
 $('#status').textContent='Duke lexuar bazën LIVE…';
 try{
   const u=API+'?action='+encodeURIComponent(ACTION)+'&limit=2000&_='+Date.now();
   const x=await fetch(u,{cache:'no-store'}); const j=await x.json();
   ALL=(Array.isArray(j.rows)?j.rows:Array.isArray(j.data)?j.data:Array.isArray(j.items)?j.items:[]).map(model).filter(complete);
   if(!ALL.length)throw Error('empty');$('#status').style.display='none'; render(ALL);
 }catch(e){$('#status').textContent='Nuk u arrit lidhja me bazën LIVE.'}
}
$('#q').addEventListener('input',()=>render(ALL)); load();
</script></body></html>
