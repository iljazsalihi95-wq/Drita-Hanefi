<!doctype html><html lang="sq"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Akide Maturidije • Drita Hanefi</title><style>
*{box-sizing:border-box}html,body{margin:0;background:#06151d;color:#eef7f4;font-family:Arial,sans-serif}
body{min-height:100vh;background:linear-gradient(180deg,#071b26,#041016)}
.top{position:sticky;top:0;z-index:20;background:rgba(5,20,28,.97);border-bottom:1px solid #1f6254;padding:12px}
.topin{max-width:1050px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{font-weight:900;font-size:22px}.sub{font-size:12px;color:#b9d8cf;margin-top:2px}
.wrap{max-width:1050px;margin:auto;padding:16px 16px 90px}
.hero{background:linear-gradient(135deg,#0b3b32,#0b2432);border:1px solid #277763;border-radius:24px;padding:22px;box-shadow:0 14px 36px #0006}
.hero h1{margin:0 0 8px;font-size:30px;color:#ffe28b}.hero p{margin:0;color:#d7ebe5;line-height:1.6}
.tools{display:flex;gap:9px;margin:14px 0;position:sticky;top:70px;z-index:15;background:#06151dee;padding:8px 0}
.search{flex:1;border:1px solid #285d58;border-radius:15px;background:#fff;color:#15231f;padding:13px 15px;font-size:16px;outline:none}
.btn{border:0;border-radius:15px;padding:0 18px;font-weight:900;background:#e7c35f;color:#15231f}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin-top:15px}
.card{display:block;text-decoration:none;color:#fff;background:#0a2730;border:1px solid #285d58;border-radius:19px;padding:16px;box-shadow:0 8px 22px #0003}
.card:active{transform:scale(.985)}.card h3{margin:5px 0 8px;color:#ffe28b}.card p{margin:0;color:#c7ded8;line-height:1.5}
.ico{font-size:32px}.status{padding:14px;border:1px dashed #285d58;border-radius:16px;color:#b9d8cf;text-align:center;margin:14px 0}
.group{margin:20px 0}.group h2{color:#ffe28b;border-bottom:1px solid #285d58;padding-bottom:9px}.subgroup{margin:15px 0}.subgroup h3{font-size:15px;color:#b9d8cf;margin:0 0 9px}.items{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:11px}.item{background:#0a2730;border:1px solid #285d58;border-radius:18px;padding:16px;box-shadow:0 8px 22px #0003}
.item h3{margin:0 0 8px;color:#ffe28b;font-size:19px}.item p{margin:8px 0;line-height:1.65;color:#d7ebe5}.label{color:#d8c878;font-size:11px;text-transform:uppercase;font-weight:900;letter-spacing:.05em}.sourcebox{margin-top:13px;padding:12px;border:1px solid #6e683b;border-radius:13px;background:#102e2b}.sourcebox b{display:block;margin-top:3px}.meta{font-size:12px;color:#8fb8ae;margin-top:8px}.arabic{direction:rtl;text-align:right;font-size:23px;line-height:1.9}.verify{display:inline-block;margin-top:10px;border:1px solid #367268;border-radius:999px;padding:5px 8px;font-size:10px;color:#cbe4dd}
.back,.sourcelink{color:#ffe28b;text-decoration:none;font-weight:800}.sourcelink{display:inline-block;margin-top:9px}.chips{display:flex;gap:7px;overflow:auto;padding:12px 0}.chip{white-space:nowrap;padding:9px 12px;border:1px solid #285d58;border-radius:999px;color:#d7ebe5}
footer{text-align:center;color:#6f9d92;padding:28px 10px}
</style></head><body>
<header class="top"><div class="topin"><div><div class="brand">☪️ Drita Hanefi</div><div class="sub">Enciklopedia Hanefi–Maturidije</div></div><a class="back" href="../../index.html">⌂ Ballina</a></div></header><main class="wrap"><section class="hero"><h1>🧭 Akide Maturidije</h1><p>Tema → Nëntema → mësimi i plotë, me argumente, autor, vepër, referencë dhe status verifikimi nga baza LIVE.</p></section>
<div class="tools"><input id="q" class="search" placeholder="Kërko në Akide Maturidije…"><button class="btn" onclick="render(ALL)">Kërko</button></div>
<div id="status" class="status">Duke u lidhur…</div><div id="count" class="meta"></div><div id="chips" class="chips"></div><section id="list"></section></main>
<footer>Drita Hanefi • Akide Maturidije</footer><script>
const API="https://script.google.com/macros/s/AKfycbyZWyxCfIvU_tXY_TYZ6R4qUFO_NLS6mCBcpMIB3yh7hmCW-_S332dwb1gnKiaaje6K/exec";
const ACTION="akide";
const VERIFIED="../../data/akide-verified.json";
let ALL=[];
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function val(o,keys){for(const k of keys){if(o&&o[k]!==undefined&&o[k]!==null&&String(o[k]).trim())return o[k]}return ''}
function raw(r,keys){return val(r&&r.raw?r.raw:{},keys)}
function model(r){const editorial=val(r,['editorial','commentary'])||raw(r,['Koment redaksional']);return{id:val(r,['id'])||raw(r,['ID']),topic:val(r,['topic'])||raw(r,['Tema']),subtopic:val(r,['subtopic'])||raw(r,['Nëntema']),title:val(r,['title'])||raw(r,['Titulli']),text:val(r,['albanian'])||raw(r,['Teksti i plotë shqip']),arabic:val(r,['arabic'])||raw(r,['Teksti arab']),translit:val(r,['transliteration'])||raw(r,['Transkriptimi']),arguments:val(r,['arguments'])||raw(r,['Argumentet']),editorial,author:val(r,['author'])||raw(r,['Autori']),work:val(r,['work'])||raw(r,['Vepra']),section:val(r,['section'])||raw(r,['Kitab/Bab/Fasl']),reference:val(r,['reference'])||raw(r,['Referenca']),additional:val(r,['additional'])||raw(r,['Burime plotësuese']),keywords:val(r,['keywords'])||raw(r,['Fjalë kyçe']),status:val(r,['status'])||raw(r,['Statusi']),verified:val(r,['verified'])||raw(r,['Data verifikimit']),url:val(r,['url'])||raw(r,['URL burimi']),sourceType:val(r,['sourceType'])||(/nuk paraqitet si citim literal/i.test(editorial)?'përmbledhje e burimit':'tekst i audituar')}}
function complete(r){const audit=[r.title,r.text,r.arguments,r.editorial,r.reference,r.additional].join(' ');return r.id&&r.topic&&r.subtopic&&r.title&&r.text&&r.author&&r.work&&r.reference&&!/PROVIZOR|PËR VERIFIKIM|PËR T.U SHTUAR|DO TË PLOTËSOHET|PËRMBLEDHJE TEMATIKE/i.test(audit)&&/PUBLIKUAR/i.test(r.status)}
function safeUrl(url){try{const u=new URL(url);return u.protocol==='https:'?u.href:''}catch{return ''}}
function render(rows){
 const q=($('#q').value||'').toLocaleLowerCase('sq');
 const a=rows.filter(r=>!q||JSON.stringify(r).toLocaleLowerCase('sq').includes(q));
 const excerpts=a.filter(r=>r.sourceType==='fragment klasik').length;
 $('#count').textContent=a.length+' mësime të publikuara • '+excerpts+' fragmente klasike të audituara';
 const topics=[...new Set(rows.map(r=>r.topic))].sort((a,b)=>a.localeCompare(b,'sq'));
 $('#chips').innerHTML=topics.map(t=>`<button class="chip" onclick="pick(decodeURIComponent('${encodeURIComponent(t)}'))">${esc(t)}</button>`).join('');
 const groups=a.reduce((o,r)=>((o[r.topic]??=[]).push(r),o),{});
 $('#list').innerHTML=a.length?Object.entries(groups).sort(([a],[b])=>a.localeCompare(b,'sq')).map(([name,items])=>{const subs=items.reduce((o,r)=>((o[r.subtopic]??=[]).push(r),o),{});return `<section class="group"><h2>${esc(name)}</h2>${Object.entries(subs).sort(([a],[b])=>a.localeCompare(b,'sq')).map(([sub,records])=>`<section class="subgroup"><h3>${esc(sub)}</h3><div class="items">${records.sort((a,b)=>a.title.localeCompare(b.title,'sq')).map(r=>{const url=safeUrl(r.url);return `<article class="item"><div class="label">${esc(r.sourceType)}</div><h3>${esc(r.title)}</h3>${r.arabic?`<p class="arabic">${esc(r.arabic)}</p>`:''}${r.translit?`<p><i>${esc(r.translit)}</i></p>`:''}<p>${esc(r.text)}</p>${r.arguments?`<div class="label">Argumentet</div><p>${esc(r.arguments)}</p>`:''}${r.editorial?`<div class="label">Shënim redaksional</div><p>${esc(r.editorial)}</p>`:''}<div class="sourcebox"><span class="label">Burimi</span><b>${esc(r.author)}</b><div>${esc(r.work)}</div>${r.section?`<div class="meta">${esc(r.section)}</div>`:''}<div class="meta">${esc(r.reference)}</div>${r.additional?`<div class="meta">Burime plotësuese: ${esc(r.additional)}</div>`:''}${url?`<a class="sourcelink" href="${esc(url)}" target="_blank" rel="noopener">Hap burimin ↗</a>`:''}</div>${r.verified?`<span class="verify">Verifikuar: ${esc(r.verified)}</span>`:''}</article>`}).join('')}</div></section>`).join('')}</section>`}).join(''):'<div class="status">Nuk u gjet mësim me këtë kërkim.</div>';
}
async function load(){
 $('#status').textContent='Duke lexuar bazën LIVE…';
 try{
   const u=API+'?action='+encodeURIComponent(ACTION)+'&limit=2000&_='+Date.now();
   const [x,v]=await Promise.all([fetch(u,{cache:'no-store'}),fetch(VERIFIED,{cache:'no-store'})]); const j=await x.json(), verified=await v.json();
   const local=(verified.rows||[]).map(model).filter(complete), live=(Array.isArray(j.rows)?j.rows:Array.isArray(j.data)?j.data:Array.isArray(j.items)?j.items:[]).map(model).filter(complete);
   ALL=[...new Map([...live,...local].map(r=>[r.id,r])).values()];
   if(!ALL.length)throw Error('empty');$('#status').style.display='none'; render(ALL);
 }catch(e){$('#status').textContent='Nuk u arrit lidhja me bazën LIVE.'}
}
function pick(topic){$('#q').value=topic;render(ALL)}
const initialQ=new URLSearchParams(location.search).get('q');if(initialQ)$('#q').value=initialQ;$('#q').addEventListener('input',()=>render(ALL)); load();
</script></body></html>
