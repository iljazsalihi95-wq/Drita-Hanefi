<!doctype html><html lang="sq"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#041A15"><title>Texhvidi – Drita Hanefi</title><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;background:#041A15;color:#fff}body{background:radial-gradient(circle at top right,rgba(228,189,86,.14),transparent 28%),linear-gradient(180deg,#041A15,#062B22 65%,#02120E)}.wrap{max-width:920px;margin:auto;padding:12px 11px 38px}.back{display:inline-block;margin-bottom:10px;padding:8px 10px;border:1px solid #e4bd5660;border-radius:10px;background:#0E5A45;color:#fff;font-weight:bold}.hero{border:1px solid #e4bd5666;border-radius:24px;padding:17px;background:linear-gradient(145deg,#0C5844,#07392E 65%,#05271F)}h1,h2{color:#FFE99B}h1{margin:0}.sub{color:#C9DCD4;font-size:12px;margin-top:5px}.search{display:flex;gap:7px;margin-top:14px;padding:6px;border:1px solid #e4bd5644;border-radius:14px;background:#021D17}.search input{flex:1;border:0;outline:0;background:transparent;color:#fff;padding:11px}.search button{border:0;border-radius:10px;background:linear-gradient(135deg,#FFE58B,#C9A33A);color:#173027;font-weight:bold;padding:0 13px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.stat{text-align:center;padding:9px;border:1px solid #e4bd563d;border-radius:13px;background:#06291F}.stat span{display:block;color:#ABC4BA;font-size:10px}.stat strong{display:block;color:#FFE99B;font-size:21px}.panel{margin:14px 0;border:1px solid #e4bd5644;border-radius:15px;overflow:hidden;background:#06291F}.toggle{width:100%;padding:12px 13px;border:0;background:#07392E;color:#FFE99B;font-weight:bold;text-align:left}.filters{display:none;padding:7px}.panel.open .filters{display:block}.filter{width:100%;border:0;border-bottom:1px solid #e4bd5622;background:transparent;color:#D7E7E1;text-align:left;padding:9px}.filter.active{color:#FFE99B;background:#0e5a4555}.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.card{padding:13px;border:1px solid #e4bd5650;border-radius:17px;background:linear-gradient(145deg,#0B4033,#06291F);cursor:pointer}.card h3{margin:0;color:#FFF0AC;font-size:17px}.pill{display:inline-block;margin:7px 4px 7px 0;padding:4px 7px;border-radius:999px;background:#021D17;border:1px solid #ffe58b33;color:#EED99A;font-size:10px}.ar{direction:rtl;text-align:right;font-family:"Traditional Arabic",serif;font-size:24px;color:#FFF4C5;line-height:1.8;margin:8px 0}.txt{color:#D7E7E1;font-size:12.5px;line-height:1.55;display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden}.status{margin-top:12px;padding:10px;text-align:center;border:1px solid #e4bd5633;border-radius:12px;background:#06291F;color:#ABC4BA;font-size:10px}.modal{position:fixed;inset:0;background:#000c;display:none;z-index:40;padding:12px;overflow:auto}.modal.show{display:block}.dlg{max-width:850px;margin:25px auto;border:1px solid #e4bd5666;border-radius:20px;background:#06291F;overflow:hidden}.head{display:flex;justify-content:space-between;align-items:center;padding:13px;background:#0B4638}.head h2{margin:0}.close{width:38px;height:38px;border:1px solid #e4bd5644;border-radius:10px;background:#021D17;color:#fff;font-size:20px}.body{padding:13px}.field{padding:11px;margin:8px 0;border:1px solid #e4bd562c;border-radius:11px;background:#021D17}.field b{display:block;color:#FFE99B;font-size:11px;margin-bottom:5px}.field div{white-space:pre-wrap;line-height:1.6;color:#E1EEE9}@media(max-width:680px){.cards{grid-template-columns:1fr}}
</style></head><body><div class="wrap"><button class="back" onclick="location.href='../quran/index.html'">← Kurani</button><section class="hero"><h1>📖 Texhvidi</h1><div class="sub">Drita Hanefi · bazë LIVE nga Google Sheet · rregulla të publikuara nga baza LIVE e Texhvidit</div><div class="search"><input id="q" placeholder="Kërko: idgam, ihfa, kalkale, med..."><button onclick="clr()">Pastro</button></div><div class="stats"><div class="stat"><span>MATERIALE</span><strong id="n">0</strong></div><div class="stat"><span>KATEGORI</span><strong id="cats">0</strong></div><div class="stat"><span>STATUS</span><strong>LIVE</strong></div></div></section><div class="panel" id="panel"><button class="toggle" id="tog">Kategoritë · Të gjitha ⌄</button><div class="filters" id="filters"></div></div><div class="cards" id="cards"><div class="status">Po ngarkohen materialet...</div></div><div class="status" id="status">Po lidhem me TEXHVIDI...</div></div><div class="modal" id="modal"><div class="dlg"><div class="head"><h2 id="mt"></h2><button class="close" onclick="closeM()">×</button></div><div class="body" id="mb"></div></div></div><script>
const SID="1jUwddiDBN4OxRS5qQM6UNa9IzQBDQ4G5L6_os2_ZxuA",SHEET='TEXHVIDI';let ALL=[],active='Të gjitha';const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function csv(t){let R=[],r=[],c='',q=false;for(let i=0;i<t.length;i++){let h=t[i],n=t[i+1];if(h=='"'&&q&&n=='"'){c+='"';i++;continue}if(h=='"'){q=!q;continue}if(h==','&&!q){r.push(c);c='';continue}if((h=='
'||h=='
')&&!q){if(h=='
'&&n=='
')i++;r.push(c);if(r.some(v=>v!==''))R.push(r);r=[];c='';continue}c+=h}if(c||r.length){r.push(c);R.push(r)}return R}function obj(a){if(!a.length)return[];let h=a[0].map(x=>String(x||'').trim());return a.slice(1).filter(r=>r.some(v=>String(v||'').trim())).map(r=>{let o={};h.forEach((k,i)=>{if(k)o[k]=r[i]??''});return o})}async function load(){try{let u=`https://docs.google.com/spreadsheets/d/${SID}/gviz/tq?tqx=out:csv&sheet=${SHEET}&_=${Date.now()}`;let r=await fetch(u,{cache:'no-store'});ALL=obj(csv(await r.text())).filter(x=>x.ID&&visible(x));$('#n').textContent=ALL.length;$('#cats').textContent=new Set(ALL.map(x=>x.Kategoria||'Bazat')).size;build();render();$('#status').textContent='✓ U ngarkuan '+ALL.length+' materiale Texhvidi.'}catch(e){$('#status').textContent='Gabim gjatë leximit.'}}function visible(x){let v=String(x.Status||x.Statusi||'').trim().toLowerCase();return !v||['publikuar','published','live','aktiv','active','po','yes','true','1'].includes(v)}function cat(x){return x.Kategoria||'Bazat'}function build(){let cs=['Të gjitha',...new Set(ALL.map(cat))];$('#filters').innerHTML=cs.map(c=>`<button class="filter ${active===c?'active':''}" data-c="${esc(c)}">${esc(c)}</button>`).join('');document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{active=b.dataset.c;build();render();$('#panel').classList.remove('open')})}function filtered(){let q=$('#q').value.toLowerCase().trim();return ALL.filter(x=>(active==='Të gjitha'||cat(x)===active)&&(!q||JSON.stringify(x).toLowerCase().includes(q)))}function render(){let a=filtered();$('#cards').innerHTML=a.map(x=>`<article class="card" data-id="${esc(x.ID)}"><h3>${esc(x.RregulliShqip||x.ID)}</h3><span class="pill">${esc(cat(x))}</span><span class="pill">${esc(x.Status||'')}</span>${x.PjesaAjetit?`<div class="ar">${esc(x.PjesaAjetit)}</div>`:''}<div class="txt">${esc(x.ShpjegimiShqip||'')}</div></article>`).join('')||'<div class="status">Nuk u gjet material.</div>';document.querySelectorAll('.card').forEach(c=>c.onclick=()=>openI(c.dataset.id))}function openI(id){let x=ALL.find(v=>v.ID===id);if(!x)return;$('#mt').textContent=x.RregulliShqip||x.ID;$('#mb').innerHTML=Object.entries(x).filter(([k,v])=>v&&String(v).trim()).map(([k,v])=>`<div class="field"><b>${esc(k)}</b><div class="${k==='PjesaAjetit'||k==='Shembull2'?'ar':''}">${esc(v)}</div></div>`).join('');$('#modal').classList.add('show')}function closeM(){$('#modal').classList.remove('show')}$('#modal').onclick=e=>{if(e.target.id==='modal')closeM()};$('#tog').onclick=()=>$('#panel').classList.toggle('open');$('#q').oninput=render;function clr(){$('#q').value='';render()}load();
</script></body></html>
