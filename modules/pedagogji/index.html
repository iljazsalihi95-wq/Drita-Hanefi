<!doctype html><html lang="sq"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Pedagogji Islame • Drita Hanefi</title><style>
*{box-sizing:border-box}html,body{margin:0;background:#06151d;color:#eef7f4;font-family:Arial,sans-serif}
body{min-height:100vh;background:linear-gradient(180deg,#071b26,#041016)}
.top{position:sticky;top:0;z-index:20;background:rgba(5,20,28,.97);border-bottom:1px solid #1f6254;padding:12px}
.topin{max-width:1050px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{font-weight:900;font-size:22px}.sub{font-size:12px;color:#b9d8cf;margin-top:2px}
.wrap{max-width:1050px;margin:auto;padding:16px 16px 90px}
.hero{background:linear-gradient(135deg,#0b3b32,#0b2432);border:1px solid #277763;border-radius:24px;padding:22px;box-shadow:0 14px 36px #0006}
.hero h1{margin:0 0 8px;font-size:30px;color:#ffe28b}.hero p{margin:0;color:#d7ebe5;line-height:1.6}
.tools{display:flex;gap:9px;margin:14px 0;position:sticky;top:70px;z-index:15;background:#06151dee;padding:8px 0}
.search{flex:1;border:1px solid #285d58;border-radius:15px;background:#fff;color:#15231f;padding:13px 15px;font-size:16px;outline:none}
.btn{border:0;border-radius:15px;padding:0 18px;font-weight:900;background:#e7c35f;color:#15231f}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin-top:15px}
.card{display:block;text-decoration:none;color:#fff;background:#0a2730;border:1px solid #285d58;border-radius:19px;padding:16px;box-shadow:0 8px 22px #0003}
.card:active{transform:scale(.985)}.card h3{margin:5px 0 8px;color:#ffe28b}.card p{margin:0;color:#c7ded8;line-height:1.5}
.ico{font-size:32px}.status{padding:14px;border:1px dashed #285d58;border-radius:16px;color:#b9d8cf;text-align:center;margin:14px 0}
.group{margin:20px 0}.group h2{color:#ffe28b;border-bottom:1px solid #285d58;padding-bottom:9px}.items{display:grid;grid-template-columns:repeat(auto-fit,minmax(285px,1fr));gap:11px}.item{background:#0a2730;border:1px solid #285d58;border-radius:18px;padding:16px;box-shadow:0 8px 22px #0003}.item h3{margin:5px 0 8px;color:#ffe28b;font-size:19px}.item p{margin:8px 0;line-height:1.65;color:#d7ebe5}.label{color:#d8c878;font-size:11px;text-transform:uppercase;font-weight:900;letter-spacing:.05em}.sourcebox{margin-top:13px;padding:12px;border:1px solid #6e683b;border-radius:13px;background:#102e2b}.meta{font-size:12px;color:#8fb8ae;margin-top:7px}.method{display:inline-block;margin:4px 4px 0 0;border:1px solid #367268;border-radius:999px;padding:5px 8px;font-size:10px;color:#cbe4dd}
.back{color:#ffe28b;text-decoration:none;font-weight:800}.chips{display:flex;gap:7px;overflow:auto;padding:12px 0}.chip{white-space:nowrap;padding:9px 12px;border:1px solid #285d58;border-radius:999px;color:#d7ebe5}
footer{text-align:center;color:#6f9d92;padding:28px 10px}
</style></head><body>
<header class="top"><div class="topin"><div><div class="brand">☪️ Drita Hanefi</div><div class="sub">Enciklopedia Hanefi–Maturidije</div></div><a class="back" href="../../index.html">⌂ Ballina</a></div></header><main class="wrap"><section class="hero"><h1>🎓 Pedagogji Islame</h1><p>Kategori → Temë → Nëntemë → mësim, me tekstin e plotë, metodën, argumentet, autorin/përgatitësin, faqen dhe burimin real.</p></section>
<div class="tools"><input id="q" class="search" placeholder="Kërko në Pedagogji Islame…"><button class="btn" onclick="render(ALL)">Kërko</button></div>
<div id="status" class="status">Duke u lidhur…</div><div id="count" class="meta"></div><section id="list"></section></main>
<footer>Drita Hanefi • Pedagogji Islame</footer><script>
const API="https://script.google.com/macros/s/AKfycbyZWyxCfIvU_tXY_TYZ6R4qUFO_NLS6mCBcpMIB3yh7hmCW-_S332dwb1gnKiaaje6K/exec";
const ACTION="pedagogji";
let ALL=[];
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function val(o,keys){for(const k of keys){if(o&&o[k]!==undefined&&o[k]!==null&&String(o[k]).trim())return o[k]}return ''}
function raw(r,keys){return val(r&&r.raw?r.raw:{},keys)}
function model(r){return{id:val(r,['id'])||raw(r,['ID']),category:val(r,['category'])||raw(r,['Kategoria']),topic:val(r,['topic'])||raw(r,['Tema']),subtopic:val(r,['subtopic'])||raw(r,['Nëntema']),title:val(r,['title'])||raw(r,['Titulli']),intro:raw(r,['Përmbledhje']),text:val(r,['albanian'])||raw(r,['Teksti i plotë shqip']),source:raw(r,['Burimi kryesor']),author:raw(r,['Autori/Përgatitësi']),reference:val(r,['reference'])||raw(r,['Referenca']),page:raw(r,['Faqja/Kapitulli']),quran:raw(r,['Argument kuranor']),hadith:raw(r,['Argument nga Hadithi']),method:raw(r,['Metoda/Termat kyç']),editorial:raw(r,['Koment redaksional']),keywords:val(r,['keywords'])||raw(r,['Fjalë kyçe']),status:val(r,['status'])||raw(r,['Statusi']),verified:raw(r,['Status Verifikimi']),file:raw(r,['URL/Skedari'])}}
function complete(r){const audit=[r.title,r.intro,r.text,r.source,r.reference,r.editorial].join(' ');return r.id&&r.category&&r.topic&&r.title&&r.text&&r.source&&(r.author||r.reference||r.page)&&!/PROVIZOR|PËR VERIFIKIM|PËR T.U SHTUAR|DO TË PLOTËSOHET|PËRMBLEDHJE TEMATIKE|JO CITIM|PLACEHOLDER|DEMO/i.test(audit)&&(!r.status||/PUBLIKUAR/i.test(r.status))}
function render(rows){
 const q=($('#q').value||'').toLocaleLowerCase('sq');
 const a=rows.filter(r=>!q||JSON.stringify(r).toLocaleLowerCase('sq').includes(q));
 $('#count').textContent=a.length+' mësime';const groups=a.reduce((o,r)=>((o[r.category]??=[]).push(r),o),{});
 $('#list').innerHTML=a.length?Object.entries(groups).sort(([a],[b])=>a.localeCompare(b,'sq')).map(([name,items])=>{const topics=items.reduce((o,r)=>((o[r.topic]??=[]).push(r),o),{});return `<section class="group"><h2>${esc(name)}</h2>${Object.entries(topics).sort(([a],[b])=>a.localeCompare(b,'sq')).map(([topic,records])=>`<h3>${esc(topic)}</h3><div class="items">${records.sort((a,b)=>a.subtopic.localeCompare(b.subtopic,'sq')).map(r=>`<article class="item"><div class="label">${esc(r.subtopic)}</div><h3>${esc(r.title)}</h3>${r.intro?`<p>${esc(r.intro)}</p>`:''}<div class="label">Mësimi i plotë</div><p>${esc(r.text)}</p>${r.quran?`<div class="label">Argument kuranor</div><p>${esc(r.quran)}</p>`:''}${r.hadith?`<div class="label">Argument nga Hadithi</div><p>${esc(r.hadith)}</p>`:''}${r.method?`<span class="method">${esc(r.method)}</span>`:''}<div class="sourcebox"><span class="label">Burimi</span><b>${esc(r.source)}</b><div>${esc(r.author)}</div><div class="meta">${esc([r.reference,r.page].filter(Boolean).join(' • '))}</div>${r.file?`<div class="meta">Dokumenti burimor: ${esc(r.file)}</div>`:''}${r.verified?`<div class="meta">Verifikuar: ${esc(r.verified)}</div>`:''}</div></article>`).join('')}</div>`).join('')}</section>`}).join(''):'<div class="status">Nuk u gjet mësim me këtë kërkim.</div>';
}
async function load(){
 $('#status').textContent='Duke lexuar bazën LIVE…';
 try{
   const u=API+'?action='+encodeURIComponent(ACTION)+'&limit=2000&_='+Date.now();
   const x=await fetch(u,{cache:'no-store'}); const j=await x.json();
   ALL=(Array.isArray(j.rows)?j.rows:Array.isArray(j.data)?j.data:Array.isArray(j.items)?j.items:[]).map(model).filter(complete);
   if(!ALL.length)throw Error('empty');$('#status').style.display='none'; render(ALL);
 }catch(e){$('#status').textContent='Nuk u arrit lidhja me bazën LIVE.'}
}
$('#q').addEventListener('input',()=>render(ALL)); load();
</script></body></html>
