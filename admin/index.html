<!doctype html><html lang="sq"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#061b17"><title>Admin • Drita Hanefi</title><style>
*{box-sizing:border-box}body{margin:0;background:linear-gradient(#08261f,#031510);color:#eef7f4;font-family:system-ui,Arial;min-height:100vh}main{max-width:1100px;margin:auto;padding:18px}a{color:#ffe28b}.hero{padding:18px;border:1px solid #d8b85c55;border-radius:22px;background:#0a3429}.hero h1{color:#ffe28b;margin:4px 0}.muted{color:#abc7bc}.summary,.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:11px;margin-top:14px}.card{background:#0a2b23;border:1px solid #ffffff14;border-radius:17px;padding:15px}.card b{color:#ffe28b;font-size:25px}.ok{color:#8ee3b3}.bad{color:#ff9d9d}.tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.tools button{border:0;border-radius:11px;padding:10px 13px;background:#d7b35d;color:#173027;font-weight:900}.bar{height:7px;background:#031510;border-radius:999px;overflow:hidden;margin-top:8px}.bar i{height:100%;display:block;background:#d7b35d}</style></head><body><main><a href="../index.html">← Ballina</a><section class="hero"><h1>🛡️ Kontrolli i sistemit</h1><p class="muted">Panel diagnostikues për bazat LIVE. Nuk ndryshon Code.gs dhe nuk publikon të dhëna.</p><div class="tools"><button onclick="run()">↻ Kontrollo përsëri</button></div><div id="overall" class="summary"></div></section><div id="grid" class="grid"></div></main><script>
const API="https://script.google.com/macros/s/AKfycbyfIejtkgBhFNL1hEb9Esf2UXFjBw9_GQc3TmC2Gwm4orDVy3dB_rjx_swnpZHQk2dW/exec";
const sets=[["Kurani","quran"],["Hadithi","hadith"],["Fikhu","fikh"],["Tefsiri","tefsir"],["Akide","akide"],["Historia","histori"],["Pedagogjia","pedagogji"],["Texhvidi","texhvid"],["Abetarja","abetare"],["Hudbet","hudbe"],["Më bëj një temë","tema"]];
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
async function get(p){const u=new URL(API);Object.entries(p).forEach(([k,v])=>u.searchParams.set(k,v));u.searchParams.set("_",Date.now());const r=await fetch(u,{cache:"no-store"});if(!r.ok)throw Error("HTTP "+r.status);return r.json()}
async function run(){grid.innerHTML=sets.map(([n,t])=>'<div class="card" id="m_'+t+'"><h3>'+n+'</h3><span class="muted">Po kontrollohet…</span></div>').join("");overall.innerHTML='<div class="card">Kontroll LIVE në proces…</div>';let ok=0,total=0;for(const [n,t] of sets){const el=document.getElementById("m_"+t);try{const j=await get({action:"list",type:t,limit:1}),rows=j.rows||j.data||j.items||[],count=Number(j.total??j.count??rows.length);total+=count;ok++;el.innerHTML='<h3>'+n+'</h3><b>'+count+'</b><p class="ok">● LIVE</p><div class="bar"><i style="width:100%"></i></div>'}catch(e){el.innerHTML='<h3>'+n+'</h3><p class="bad">● Gabim lidhjeje</p><small>'+esc(e.message)+'</small>'}}overall.innerHTML='<div class="card"><span class="muted">SISTEME LIVE</span><br><b>'+ok+'/'+sets.length+'</b></div><div class="card"><span class="muted">REKORDE TË NUMËRUARA</span><br><b>'+total+'</b></div><div class="card"><span class="muted">KONTROLLI</span><br><b>'+(ok===sets.length?"✓":"⚠")+'</b></div>'}run();
</script></body></html>
