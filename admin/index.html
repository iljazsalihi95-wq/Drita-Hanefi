<!doctype html><html lang="sq"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin • Drita Hanefi</title><style>body{margin:0;background:#06151d;color:#eef7f4;font-family:Arial}main{max-width:1050px;margin:auto;padding:20px}h1{color:#ffe28b}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.card{background:#0a2730;border:1px solid #285d58;border-radius:18px;padding:16px}b{color:#ffe28b;font-size:24px}a{color:#ffe28b}</style></head><body><main><a href="../index.html">← Ballina</a><h1>🛠️ Admini — Kontrolli LIVE</h1><p>Ky panel nuk ndryshon Code.gs. Kontrollon lidhjen dhe numrin e rekordeve që ekspozon API ekzistuese.</p><div id="grid" class="grid"></div></main><script>const API='https://script.google.com/macros/s/AKfycbyZWyxCfIvU_tXY_TYZ6R4qUFO_NLS6mCBcpMIB3yh7hmCW-_S332dwb1gnKiaaje6K/exec';const sets=[['Fikhu','fikh.list'],['Hadithi','hadith.list'],['Tefsiri','tefsir.list'],['Akide','akide'],['Hudbe','hutbe'],['Pedagogji','pedagogji'],['Histori','histori'],['Texhvid','texhvid'],['Abetare','abetare']];async function run(){const g=document.getElementById('grid');g.innerHTML=sets.map(x=>`<div class="card" id="a_${x[1].replace('.','_')}"><h3>${x[0]}</h3><span>Po kontrollohet…</span></div>`).join('');for(const [n,a] of sets){const el=document.getElementById('a_'+a.replace('.','_'));try{const r=await fetch(API+'?action='+encodeURIComponent(a)+'&limit=500&_='+Date.now(),{cache:'no-store'}),j=await r.json(),rows=Array.isArray(j)?j:(j.rows||j.data||j.items||[]);el.innerHTML=`<h3>${n}</h3><b>${rows.length}</b><p>rekorde LIVE</p>`}catch(e){el.innerHTML=`<h3>${n}</h3><p>⚠️ Lidhja dështoi</p>`}}}run()</script></body></html>
