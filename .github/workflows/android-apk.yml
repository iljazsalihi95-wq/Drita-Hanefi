name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/android-apk.yml"
      - "android/**"
      - "admin/**"
      - "assets/**"
      - "data/**"
      - "modules/**"
      - "tests/**"
      - "tools/**"
      - "index.html"
      - "manifest.webmanifest"
      - "sw.js"
concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Index existing verified Hadith batches
        working-directory: .
        run: node tools/index-verified-hadith.mjs
      - name: Normalize recoverable packaged JSON
        working-directory: .
        run: node tools/normalize-packed-json.mjs data/hadith/bukhari.json data/hadith/tirmidhi.json
      - name: Verify Arabic alignment and offline application contracts
        working-directory: .
        run: |
          node tests/recitation.mjs
          node tests/verified-hadith.mjs
          node tests/verify.mjs --offline
      - name: Verify real content and module integration
        working-directory: .
        run: node tests/content-integrity.mjs
      - name: Verify application pages and live data contracts
        working-directory: .
        run: node tests/verify.mjs
      - name: Bundle audited web application
        run: gradle :app:syncDritaWebAssets
      - run: gradle :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Drita-Hanefi-Android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

  web-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install browser test dependency outside repository
        run: npm install --prefix "$RUNNER_TEMP/drita-browser" --no-package-lock --no-save playwright
      - name: Test PWA and recitation feedback in Chrome
        env:
          DRITA_PLAYWRIGHT_MODULE: ${{ runner.temp }}/drita-browser/node_modules/playwright
          DRITA_CHROME_PATH: /usr/bin/google-chrome
        run: node tests/recitation-browser.mjs
