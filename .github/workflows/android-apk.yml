name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/android-apk.yml"
      - "android/**"
      - "admin/**"
      - "assets/**"
      - "data/**"
      - "modules/**"
      - "tests/**"
      - "index.html"
      - "manifest.webmanifest"
      - "sw.js"
concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Verify real content and module integration
        working-directory: .
        run: node tests/content-integrity.mjs
      - name: Verify application pages and live data contracts
        working-directory: .
        run: node tests/verify.mjs
      - name: Bundle audited web application
        working-directory: .
        run: |
          mkdir -p android/app/src/main/assets/site
          rsync -a --delete \
            --exclude='.git' --exclude='.github' --exclude='android' \
            --exclude='tests' --exclude='README.md' --exclude='Code.gs' ./ \
            android/app/src/main/assets/site/
      - run: gradle :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Drita-Hanefi-Android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
